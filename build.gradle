plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
group = project.maven_group

version = project.mod_version + "+" + project.minecraft_version

repositories {
    maven { url 'https://maven.nucleoid.xyz/releases/' }
    maven { url 'https://maven.nucleoid.xyz/' }
    maven { url 'https://maven.isxander.dev/releases' }
}

dependencies {
    // Minecraft & Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Polymer
    implementation include("eu.pb4:polymer-core:${project.polymer_version}")
    implementation include("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    implementation include("eu.pb4:polymer-autohost:${project.polymer_version}")

    // YACL
    implementation("dev.isxander:yet-another-config-lib:${project.yacl_version}") {
        exclude group: 'com.twelvemonkeys.imageio'
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	options.compilerArgs << "-Xlint:deprecation"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
